# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

dotenv: [".env"]

vars:
  BINARY: build/go-agent

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  build:
    desc: Build agent binary
    cmds:
      - go build -o {{.BINARY}}
    sources:
      - ./**/*.go
      - go.mod
      - go.sum
    generates:
      - "{{.BINARY}}"

  run:
    desc: Build and start the interactive agent (loads .env)
    deps: [build]
    cmds:
      - "{{.BINARY}}"
    interactive: true

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  fmt:
    desc: Format all Go source files
    cmds:
      - gofmt -s -w .

  tidy:
    desc: Tidy module dependencies
    cmds:
      - go mod tidy

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf build

  build-cross:
    desc: Cross-compile for a given platform (usage - task build-cross GOOS=linux GOARCH=amd64)
    vars:
      GOOS: '{{.GOOS | default "linux"}}'
      GOARCH: '{{.GOARCH | default "amd64"}}'
      EXT: '{{if eq .GOOS "windows"}}.exe{{end}}'
      OUT: 'build/go-agent-{{.GOOS}}-{{.GOARCH}}{{.EXT}}'
    cmds:
      - env GOOS={{.GOOS}} GOARCH={{.GOARCH}} CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o {{.OUT}} .

  build-all:
    desc: Cross-compile for all supported platforms
    cmds:
      - |
        for os in linux darwin windows; do
          for arch in amd64 arm64; do
            ext=""
            [ "$os" = "windows" ] && ext=".exe"
            echo "-> building $os/$arch"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" \
              -o "build/go-agent-${os}-${arch}${ext}" .
          done
        done