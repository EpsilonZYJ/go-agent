# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

dotenv: [".env"]

vars:
  BINARY: build/go-agent

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  build:
    desc: Build agent binary
    cmds:
      - go build -o {{.BINARY}}
    sources:
      - ./**/*.go
      - go.mod
      - go.sum
    generates:
      - "{{.BINARY}}"

  run:
    desc: Build and start the interactive agent (loads .env)
    deps: [build]
    cmds:
      - "{{.BINARY}}"
    interactive: true

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  fmt:
    desc: Format all Go source files
    cmds:
      - gofmt -s -w .

  tidy:
    desc: Tidy module dependencies
    cmds:
      - go mod tidy

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf build
